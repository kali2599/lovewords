<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Cambia password — Parolario</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body><div class="shell auth-shell"><header><a class="brand brand-link" href="{{ url_for('home') }}">parola<span>rio</span> ✳</a></header><main class="auth-card"><div class="eyebrow">Sicurezza dell’account</div><h1>Cambia password</h1><p>Per continuare, inserisci la password attuale e scegline una nuova.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-list">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current_password">Password attuale</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus><label for="password">Nuova password</label><input id="password" name="password" type="password" autocomplete="new-password" required><label for="password_confirmation">Ripeti la nuova password</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required><button class="primary" type="submit">Aggiorna password</button></form>
<form method="post" action="{{ url_for('logout') }}" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary" type="submit">Esci</button></form></main></div></body></html>
